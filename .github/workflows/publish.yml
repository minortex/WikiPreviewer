name: Release and publish extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: marketplace-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          node -e "
            const pkg = require('./package.json');
            if ('v' + pkg.version !== process.env.GITHUB_REF_NAME) {
              console.error('tag', process.env.GITHUB_REF_NAME, '!= v' + pkg.version);
              process.exit(1);
            }
          "
      - run: npm ci
      - run: npm test
      - name: Package VSIX
        run: npm run package:vsix
      - name: Attach VSIX to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./package.json').version")"
          file="dist/wiki-previewer-${version}.vsix"
          test -f "$file"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$file" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$file" \
              --title "WikiPreviewer $GITHUB_REF_NAME" \
              --generate-notes \
              --verify-tag
          fi
      - name: Publish to VS Marketplace
        run: |
          version="$(node -p "require('./package.json').version")"
          npx --yes @vscode/vsce publish --oidc --packagePath "dist/wiki-previewer-${version}.vsix" --skip-duplicate
      - name: Publish to Open VSX
        run: |
          version="$(node -p "require('./package.json').version")"
          npx --yes ovsx publish "dist/wiki-previewer-${version}.vsix" --trusted-publishing --skip-duplicate
